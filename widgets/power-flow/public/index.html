<html>
  <head>
    <style>
      :root {
        --accent: #e8410f;   /* import / consumption */
        --export: #0f8a4c;
        --idle: #9a999390;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #f9461c;
          --export: #2fa65a;
        }
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--homey-text-color, #0d1114);
      }

      /* Fit both dimensions, otherwise scaling to width overflows the fixed
         widget height and clips the captions. */
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .icon.filled {
        fill: currentColor;
        stroke: none;
      }

      .node.accent {
        color: var(--accent);
      }

      .node.export {
        color: var(--export);
      }

      .node.idle {
        color: var(--idle);
      }

      .name {
        fill: var(--homey-text-color, #0d1114);
        opacity: 0.55;
        font-size: 10px;
        text-anchor: middle;
      }

      .value {
        fill: var(--homey-text-color, #0d1114);
        font-size: 15px;
        font-weight: 700;
        text-anchor: middle;
      }

      .value .unit {
        font-size: 10px;
        font-weight: 400;
        opacity: 0.6;
      }

      /* Ring around the home icon: the arc length is the share of consumption
         currently covered by solar. Butt caps so a 0% arc draws nothing. */
      .ring-track {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        opacity: 0.15;
      }

      .ring-fill {
        fill: none;
        stroke: var(--export);
        stroke-width: 3;
        stroke-linecap: butt;
      }

      /* Fixed chevrons per path, like Sense's own view; motion comes from a
         staggered opacity wave travelling tail-to-tip (document order). */
      .chevrons path {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: pulse 1.05s linear infinite;
      }

      #export-flow .chevrons path {
        stroke: var(--export);
      }

      .chevrons path:nth-child(2) { animation-delay: 0.15s; }
      .chevrons path:nth-child(3) { animation-delay: 0.3s; }
      .chevrons path:nth-child(4) { animation-delay: 0.45s; }
      .chevrons path:nth-child(5) { animation-delay: 0.6s; }
      .chevrons path:nth-child(6) { animation-delay: 0.75s; }
      .chevrons path:nth-child(7) { animation-delay: 0.9s; }

      .flow.idle {
        display: none;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.3;
        }
        25% {
          opacity: 1;
        }
      }

      #message {
        padding: var(--homey-su-4, 16px);
        text-align: center;
        opacity: 0.6;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>

  <body class="homey-widget">
    <p id="message" class="homey-text-small" hidden>No Sense devices yet.</p>

    <svg id="diagram" viewBox="0 0 300 178" role="img" aria-label="Power flow">
      <!-- home, top point of the triangle, ringed by the solar share -->
      <circle class="ring-track" id="solar-ring-track" cx="150" cy="34" r="22" hidden />
      <circle class="ring-fill" id="solar-ring" cx="150" cy="34" r="22"
              transform="rotate(-90 150 34)" hidden />
      <g id="home-node" class="node accent">
        <g class="icon filled" transform="translate(150 34) scale(0.72)">
          <path d="M 0 -15 L 15.5 -4.5 L 15.5 13 L 4.5 13 L 4.5 2.5 L -4.5 2.5 L -4.5 13 L -15.5 13 L -15.5 -4.5 Z" />
        </g>
      </g>
      <text class="value" x="150" y="68" id="home-value">—</text>
      <text class="name" x="150" y="82">Home</text>
      <text class="name" x="150" y="96" id="solar-share" hidden></text>

      <!-- grid, lower left -->
      <g id="grid-node" class="node idle">
        <g class="icon" transform="translate(52 118)">
          <path d="M 0 -13 L 0 13" stroke-width="2.6" />
          <path d="M -10 -7 L 10 -7" />
          <path d="M -10 -7 L -10 -9.5 M 10 -7 L 10 -9.5" />
          <path d="M -10 -9.5 Q -12.2 -8 -13 -4" />
          <path d="M 10 -9.5 Q 12.2 -8 13 -4" />
          <path d="M -7 13 L 0 2 L 7 13" />
        </g>
      </g>
      <text class="value" x="52" y="152" id="grid-value">—</text>
      <text class="name" x="52" y="166" id="grid-name">Grid</text>

      <!-- solar, lower right -->
      <g id="solar-node" class="node idle">
        <g class="icon filled" transform="translate(248 118)">
          <circle r="7" />
          <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M 0 -13.5 L 0 -10.5 M 0 10.5 L 0 13.5" />
            <path d="M -13.5 0 L -10.5 0 M 10.5 0 L 13.5 0" />
            <path d="M -9.5 -9.5 L -7.4 -7.4 M 7.4 7.4 L 9.5 9.5" />
            <path d="M -9.5 9.5 L -7.4 7.4 M 7.4 -7.4 L 9.5 -9.5" />
          </g>
        </g>
      </g>
      <text class="value" x="248" y="152" id="solar-value">—</text>
      <text class="name" x="248" y="166">Solar</text>

      <!-- grid -> home diagonal: translate to the grid node, rotate onto the
           path (atan2(-84, 98) = -40.6 deg), then the chevrons live on local x -->
      <g id="grid-flow" class="flow idle">
        <g transform="translate(52 118) rotate(-40.6)">
          <g class="chevrons">
            <path d="M 34 -5.5 L 43 0 L 34 5.5" />
            <path d="M 51 -5.5 L 60 0 L 51 5.5" />
            <path d="M 68 -5.5 L 77 0 L 68 5.5" />
          </g>
        </g>
      </g>

      <!-- solar -> home diagonal: atan2(-84, -98) = -139.4 deg -->
      <g id="solar-flow" class="flow idle">
        <g transform="translate(248 118) rotate(-139.4)">
          <g class="chevrons">
            <path d="M 34 -5.5 L 43 0 L 34 5.5" />
            <path d="M 51 -5.5 L 60 0 L 51 5.5" />
            <path d="M 68 -5.5 L 77 0 L 68 5.5" />
          </g>
        </g>
      </g>

      <!-- solar -> grid along the bottom edge, shown while exporting -->
      <g id="export-flow" class="flow idle">
        <g transform="translate(248 118) rotate(180)">
          <g class="chevrons">
            <path d="M 34 -5.5 L 43 0 L 34 5.5" />
            <path d="M 51 -5.5 L 60 0 L 51 5.5" />
            <path d="M 68 -5.5 L 77 0 L 68 5.5" />
            <path d="M 85 -5.5 L 94 0 L 85 5.5" />
            <path d="M 102 -5.5 L 111 0 L 102 5.5" />
            <path d="M 119 -5.5 L 128 0 L 119 5.5" />
            <path d="M 136 -5.5 L 145 0 L 136 5.5" />
          </g>
        </g>
      </g>
    </svg>

    <script type="text/javascript">
      function setValue(id, watts) {
        const el = document.getElementById(id);

        if (watts === null || watts === undefined) {
          el.textContent = '—';
          return;
        }

        el.textContent = Math.round(Math.abs(watts)).toLocaleString();

        const unit = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        unit.setAttribute('class', 'unit');
        unit.textContent = ' W';
        el.appendChild(unit);
      }

      function render(data) {
        const message = document.getElementById('message');
        const diagram = document.getElementById('diagram');

        // .hidden is an HTMLElement property that does not exist on SVG
        // elements, so toggle the attribute the [hidden] CSS rule matches.
        message.toggleAttribute('hidden', data.paired);
        diagram.toggleAttribute('hidden', !data.paired);

        setValue('home-value', data.consumption);
        setValue('grid-value', data.grid);
        // Overnight the inverter's own draw takes solar_w slightly negative;
        // that is consumption, not production, so show it as zero.
        setValue('solar-value', typeof data.solar === 'number' ? Math.max(data.solar, 0) : data.solar);

        const exporting = typeof data.grid === 'number' && data.grid < 0;
        const importing = typeof data.grid === 'number' && data.grid > 0;

        // Importing runs up the grid diagonal; exporting runs along the bottom
        // edge from solar to grid, leaving the grid diagonal quiet.
        document.getElementById('grid-flow').classList.toggle('idle', !importing);
        document.getElementById('export-flow').classList.toggle('idle', !exporting);

        const gridNode = document.getElementById('grid-node');
        gridNode.classList.toggle('accent', importing);
        gridNode.classList.toggle('export', exporting);
        gridNode.classList.toggle('idle', !importing && !exporting);

        document.getElementById('grid-name').textContent =
          exporting ? 'To Grid' : importing ? 'From Grid' : 'Grid';

        const producing = typeof data.solar === 'number' && data.solar > 5;
        document.getElementById('solar-flow').classList.toggle('idle', !producing);
        document.getElementById('solar-node').classList.toggle('accent', producing);
        document.getElementById('solar-node').classList.toggle('idle', !producing);

        // Share of consumption currently covered by solar, shown as an arc
        // around the home icon. Hidden entirely when either figure is missing.
        const share =
          typeof data.solar === 'number' && typeof data.consumption === 'number' && data.consumption > 0
            ? Math.min(Math.max(data.solar / data.consumption, 0), 1)
            : null;

        const ring = document.getElementById('solar-ring');
        const circumference = 2 * Math.PI * 22;

        document.getElementById('solar-ring-track').toggleAttribute('hidden', share === null);
        ring.toggleAttribute('hidden', share === null);

        const shareText = document.getElementById('solar-share');
        shareText.toggleAttribute('hidden', share === null);

        if (share !== null) {
          ring.setAttribute('stroke-dasharray', `${share * circumference} ${circumference}`);
          shareText.textContent = `${Math.round(share * 100)}% solar`;
        }
      }

      function onHomeyReady(Homey) {
        Homey.ready({ height: 200 });

        const poll = () =>
          Homey.api('GET', '/', {})
            .then(render)
            .catch(console.error);

        poll();
        setInterval(poll, 2000);
      }

      // Dev preview: opening the file directly in a browser (where Homey never
      // calls onHomeyReady) renders mock values from the query string, e.g.
      // index.html?grid=-2400&solar=3200&consumption=800
      // Without parameters everything stays quiet: dashes and no flows.
      if (location.protocol === 'file:') {
        const query = new URLSearchParams(location.search);
        const num = (key) => (query.has(key) ? Number(query.get(key)) : null);

        render({
          paired: true,
          grid: num('grid'),
          consumption: num('consumption'),
          solar: num('solar'),
        });
      }
    </script>
  </body>
</html>
