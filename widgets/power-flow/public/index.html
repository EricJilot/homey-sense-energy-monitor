<html>
  <head>
    <style>
      body {
        margin: 0;
        color: var(--homey-text-color, #0d1114);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .ring {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        opacity: 0.18;
      }

      .icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .label {
        fill: currentColor;
        opacity: 0.55;
        font-size: 10px;
        text-anchor: middle;
      }

      .value {
        fill: currentColor;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }

      .line {
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        opacity: 0.12;
      }

      /* Dash length plus gap is 12, so a -12 offset loops seamlessly. */
      .flow {
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 5 7;
        animation: march 1.1s linear infinite;
      }

      .flow.reverse {
        animation-direction: reverse;
      }

      .flow.idle {
        animation: none;
        opacity: 0;
      }

      @keyframes march {
        to {
          stroke-dashoffset: -12;
        }
      }

      .import {
        stroke: #ff8c00;
      }

      .export {
        stroke: #3baa57;
      }

      .solar {
        stroke: #ffc02e;
      }

      #message {
        padding: var(--homey-su-4, 16px);
        text-align: center;
        opacity: 0.6;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>

  <body class="homey-widget">
    <p id="message" class="homey-text-small" hidden>No Sense devices yet.</p>

    <svg id="diagram" viewBox="0 0 300 170" role="img" aria-label="Power flow">
      <!-- grid -->
      <circle class="ring" cx="46" cy="60" r="28" />
      <g class="icon" transform="translate(46 60)">
        <path d="M -9 12 L -4 -11 M 9 12 L 4 -11 M -4 -11 L 4 -11" />
        <path d="M -7 3 L 7 3 M -5.5 -4 L 5.5 -4" />
      </g>
      <text class="label" x="46" y="112">Grid</text>
      <text class="value" x="46" y="130" id="grid-value">—</text>
      <text class="label" x="46" y="146" id="grid-caption"></text>

      <!-- home -->
      <circle class="ring" cx="150" cy="60" r="28" />
      <g class="icon" transform="translate(150 60)">
        <path d="M -11 -1 L 0 -11 L 11 -1" />
        <path d="M -8 -1 L -8 11 L 8 11 L 8 -1" />
        <path d="M -2.5 11 L -2.5 3 L 2.5 3 L 2.5 11" />
      </g>
      <text class="label" x="150" y="112">Home</text>
      <text class="value" x="150" y="130" id="home-value">—</text>

      <!-- solar -->
      <circle class="ring" cx="254" cy="60" r="28" />
      <g class="icon" transform="translate(254 60)">
        <path d="M -12 6 L -8 -8 L 12 -8 L 8 6 Z" />
        <path d="M -10 1 L 10 1 M -3.2 -8 L -5 6 M 3.8 -8 L 2 6" />
        <path d="M 0 9 L 0 12" />
      </g>
      <text class="label" x="254" y="112">Solar</text>
      <text class="value" x="254" y="130" id="solar-value">—</text>

      <line class="line" x1="78" y1="60" x2="120" y2="60" />
      <line class="line" x1="222" y1="60" x2="180" y2="60" />

      <line id="grid-flow" class="flow idle import" x1="78" y1="60" x2="120" y2="60" />
      <line id="solar-flow" class="flow idle solar" x1="222" y1="60" x2="180" y2="60" />
    </svg>

    <script type="text/javascript">
      function format(watts) {
        if (watts === null || watts === undefined) return '—';

        const magnitude = Math.abs(watts);
        return magnitude >= 1000
          ? (magnitude / 1000).toFixed(magnitude >= 10000 ? 1 : 2) + ' kW'
          : Math.round(magnitude) + ' W';
      }

      function render(data) {
        const message = document.getElementById('message');
        const diagram = document.getElementById('diagram');

        message.hidden = data.paired;
        diagram.hidden = !data.paired;

        document.getElementById('grid-value').textContent = format(data.grid);
        document.getElementById('home-value').textContent = format(data.consumption);
        document.getElementById('solar-value').textContent = format(data.solar);

        const gridFlow = document.getElementById('grid-flow');
        const exporting = typeof data.grid === 'number' && data.grid < 0;
        const importing = typeof data.grid === 'number' && data.grid > 0;

        gridFlow.classList.toggle('idle', !importing && !exporting);
        gridFlow.classList.toggle('reverse', exporting);
        gridFlow.classList.toggle('export', exporting);
        gridFlow.classList.toggle('import', !exporting);

        document.getElementById('grid-caption').textContent =
          exporting ? 'Exporting' : importing ? 'Importing' : '';

        const producing = typeof data.solar === 'number' && data.solar > 5;
        document.getElementById('solar-flow').classList.toggle('idle', !producing);
      }

      function onHomeyReady(Homey) {
        Homey.ready({ height: 200 });

        const poll = () =>
          Homey.api('GET', '/', {})
            .then(render)
            .catch(console.error);

        poll();
        setInterval(poll, 2000);
      }
    </script>
  </body>
</html>
