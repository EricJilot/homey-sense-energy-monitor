<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f4f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e8e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  
  <!-- Title -->
  <text x="600" y="60" font-size="48" font-weight="bold" fill="#ff6600" text-anchor="middle">Energy Insights &amp; Automation</text>
  <text x="600" y="110" font-size="24" fill="#666" text-anchor="middle">Integrate with your Homey smart home for advanced automation and insights</text>
  
  <!-- Feature 1: Real-time Alerts -->
  <rect x="50" y="150" width="330" height="480" rx="16" fill="#ffffff" stroke="#ff6600" stroke-width="2"/>
  
  <circle cx="215" cy="210" r="30" fill="#fff0e6" stroke="#ff6600" stroke-width="2"/>
  <text x="215" y="220" font-size="32" text-anchor="middle">🔔</text>
  
  <text x="215" y="280" font-size="20" font-weight="bold" fill="#ff6600" text-anchor="middle">Real-time Alerts</text>
  <text x="215" y="320" font-size="14" fill="#666" text-anchor="middle">Get notifications when your</text>
  <text x="215" y="340" font-size="14" fill="#666" text-anchor="middle">energy usage spikes</text>
  
  <!-- Alert example -->
  <rect x="70" y="380" width="290" height="70" rx="8" fill="#fff9f0" stroke="#ff6600" stroke-width="1"/>
  <circle cx="90" cy="410" r="6" fill="#ff6600"/>
  <text x="110" y="415" font-size="12" font-weight="bold" fill="#333">High power usage detected!</text>
  <text x="110" y="435" font-size="11" fill="#666">4.2 kW - 60% above average</text>
  
  <!-- Feature 2: Smart Automation -->
  <rect x="435" y="150" width="330" height="480" rx="16" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  
  <circle cx="600" cy="210" r="30" fill="#e6f0ff" stroke="#0066cc" stroke-width="2"/>
  <text x="600" y="220" font-size="32" text-anchor="middle">⚙️</text>
  
  <text x="600" y="280" font-size="20" font-weight="bold" fill="#0066cc" text-anchor="middle">Smart Automation</text>
  <text x="600" y="320" font-size="14" fill="#666" text-anchor="middle">Create flows to automatically</text>
  <text x="600" y="340" font-size="14" fill="#666" text-anchor="middle">control devices based on usage</text>
  
  <!-- Automation example -->
  <rect x="455" y="380" width="290" height="70" rx="8" fill="#f0f5ff" stroke="#0066cc" stroke-width="1"/>
  <text x="475" y="405" font-size="12" font-weight="bold" fill="#333">When power usage &gt; 5 kW</text>
  <text x="475" y="425" font-size="12" fill="#666">Then reduce air conditioner</text>
  
  <!-- Feature 3: Circuit Breakdown -->
  <rect x="820" y="150" width="330" height="480" rx="16" fill="#ffffff" stroke="#00aa00" stroke-width="2"/>
  
  <circle cx="985" cy="210" r="30" fill="#e8f4e8" stroke="#00aa00" stroke-width="2"/>
  <text x="985" y="220" font-size="32" text-anchor="middle">⚡</text>
  
  <text x="985" y="280" font-size="20" font-weight="bold" fill="#00aa00" text-anchor="middle">Circuit Breakdown</text>
  <text x="985" y="320" font-size="14" fill="#666" text-anchor="middle">See which devices consume</text>
  <text x="985" y="340" font-size="14" fill="#666" text-anchor="middle">the most energy</text>
  
  <!-- Circuit example -->
  <rect x="840" y="380" width="290" height="70" rx="8" fill="#f0f8f0" stroke="#00aa00" stroke-width="1"/>
  <text x="860" y="405" font-size="11" font-weight="bold" fill="#333">Cooling: 2.1 kW (65%)</text>
  <text x="860" y="425" font-size="11" fill="#666">Lighting: 0.4 kW (12%)</text>
  <text x="860" y="435" font-size="11" fill="#666">Other: 0.7 kW (23%)</text>
</svg>