<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="60" font-size="48" font-weight="bold" fill="#0066cc" text-anchor="middle">Real-Time Power Monitoring</text>
  <text x="600" y="110" font-size="24" fill="#666" text-anchor="middle">Track your energy consumption instantly with Sense Energy Monitor</text>
  
  <!-- Left panel - Current Power -->
  <rect x="50" y="150" width="500" height="480" rx="16" fill="#ffffff" stroke="#0066cc" stroke-width="2" box-shadow="0 4px 6px rgba(0,0,0,0.1)"/>
  
  <text x="100" y="200" font-size="20" font-weight="bold" fill="#0066cc">Current Power</text>
  
  <!-- Large power display -->
  <circle cx="300" cy="350" r="100" fill="#f0f4f8" stroke="#0066cc" stroke-width="2"/>
  <text x="300" y="360" font-size="64" font-weight="bold" fill="#0066cc" text-anchor="middle">3.2</text>
  <text x="300" y="390" font-size="28" fill="#0066cc" text-anchor="middle">kW</text>
  
  <!-- Mini gauges below -->
  <rect x="80" y="480" width="140" height="100" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="150" y="500" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">Peak Load</text>
  <text x="150" y="535" font-size="28" font-weight="bold" fill="#ff6600" text-anchor="middle">5.8 kW</text>
  
  <rect x="280" y="480" width="140" height="100" rx="8" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="500" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">Avg Load</text>
  <text x="350" y="535" font-size="28" font-weight="bold" fill="#0066cc" text-anchor="middle">2.1 kW</text>
  
  <!-- Right panel - Energy Trends -->
  <rect x="650" y="150" width="500" height="480" rx="16" fill="#ffffff" stroke="#00aa00" stroke-width="2"/>
  
  <text x="700" y="200" font-size="20" font-weight="bold" fill="#00aa00">Daily Energy Usage</text>
  
  <!-- Simple bar chart -->
  <rect x="700" y="250" width="35" height="350" fill="#e8f4e8" stroke="#00aa00" stroke-width="1"/>
  <text x="717" y="620" font-size="12" fill="#666" text-anchor="middle">Mon</text>
  
  <rect x="760" y="220" width="35" height="380" fill="#d0e8d0" stroke="#00aa00" stroke-width="1"/>
  <text x="777" y="620" font-size="12" fill="#666" text-anchor="middle">Tue</text>
  
  <rect x="820" y="240" width="35" height="360" fill="#c0e4c0" stroke="#00aa00" stroke-width="1"/>
  <text x="837" y="620" font-size="12" fill="#666" text-anchor="middle">Wed</text>
  
  <rect x="880" y="180" width="35" height="420" fill="#b0e0b0" stroke="#00aa00" stroke-width="1"/>
  <text x="897" y="620" font-size="12" fill="#666" text-anchor="middle">Thu</text>
  
  <rect x="940" y="200" width="35" height="400" fill="#a0dca0" stroke="#00aa00" stroke-width="1"/>
  <text x="957" y="620" font-size="12" fill="#666" text-anchor="middle">Fri</text>
  
  <!-- Energy summary -->
  <rect x="750" y="480" width="200" height="100" rx="8" fill="#f0f8f0" stroke="#00aa00" stroke-width="1"/>
  <text x="850" y="505" font-size="14" font-weight="bold" fill="#00aa00" text-anchor="middle">Total This Week</text>
  <text x="850" y="545" font-size="32" font-weight="bold" fill="#00aa00" text-anchor="middle">87.3 kWh</text>
  
  <!-- Homey integration badge -->
  <rect x="1000" y="480" width="130" height="100" rx="8" fill="#fff0f5" stroke="#ff1493" stroke-width="2"/>
  <text x="1065" y="510" font-size="12" font-weight="bold" fill="#ff1493" text-anchor="middle">Homey</text>
  <text x="1065" y="530" font-size="11" fill="#666" text-anchor="middle">Compatible</text>
  <text x="1065" y="565" font-size="11" fill="#666" text-anchor="middle">Real-time sync</text>
</svg>