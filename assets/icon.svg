<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
  
  <!-- Power meter body -->
  <rect x="50" y="50" width="100" height="100" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- Display screen -->
  <rect x="60" y="60" width="80" height="50" rx="5" fill="#e8f4f8" stroke="#333" stroke-width="1.5"/>
  
  <!-- Watts display -->
  <text x="100" y="95" font-size="28" font-weight="bold" fill="#0066cc" text-anchor="middle">W</text>
  
  <!-- KWh indicator -->
  <text x="100" y="115" font-size="12" fill="#666" text-anchor="middle">kWh</text>
  
  <!-- Terminal lines (power in/out) -->
  <line x1="70" y1="130" x2="70" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="130" x2="130" y2="145" stroke="#333" stroke-width="2"/>
  
  <!-- Lightning bolt for energy -->
  <path d="M 100 130 L 95 140 L 105 140 L 100 155" fill="#ff9900" stroke="#333" stroke-width="1"/>
</svg>