<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Device base -->
  <rect x="40" y="50" width="120" height="90" rx="8" fill="#ffffff" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Screen area -->
  <rect x="50" y="60" width="100" height="60" rx="4" fill="#fff5f0" stroke="#FF8C00" stroke-width="1.5"/>
  
  <!-- Power display -->
  <text x="100" y="100" font-size="32" font-weight="bold" fill="#FF8C00" text-anchor="middle">W</text>
  <text x="100" y="115" font-size="10" fill="#FF8C00" text-anchor="middle">Power</text>
  
  <!-- Indicator lights -->
  <circle cx="60" cy="145" r="4" fill="#00cc00"/>
  <circle cx="100" cy="145" r="4" fill="#ffaa00"/>
  <circle cx="140" cy="145" r="4" fill="#cccccc"/>
  
  <!-- Bottom panel detail -->
  <rect x="50" y="150" width="100" height="3" fill="#FF8C00"/>
</svg>